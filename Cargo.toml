[package]
name = "cr-tray"
version = "0.2.0"
edition = "2021"
description = "CloseRouter usage tray widget for KDE Plasma"

[dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }
fontdue = "0.9.5"
ureq = { version = "3.5", features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
encoding_rs = "0.8"
jiff = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true